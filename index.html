 var invitesRef = fbRef(fbDB, "filos_invites");
 inviteUnsubscribe = fbOnValue(invitesRef, function(snapshot){
  var data = snapshot && snapshot.val ? snapshot.val() : null;
  if(!data) return;
  // Cerca un invito non ancora visto, non mandato da noi
  var keys = Object.keys(data);
  for(var i=0;i<keys.length;i++){
   var inv = data[keys[i]];
   if(!inv || inv.from === FILOS_NAME) continue;
   // Non ancora scaduto (max 30 sec)
   if(Date.now() - inv.ts > 30000) continue;
   // Filtro codice pub: l'invito deve essere per il nostro pub (o senza filtro)
   if(inv.pubCode && FILOS_PUB_CODE && inv.pubCode !== FILOS_PUB_CODE) continue;
   // Non già mostrato
   if(window._lastInviteShown === keys[i]) continue;
   window._lastInviteShown = keys[i];
   showInviteBanner(inv, keys[i]);
   break;
  }
 });
}

  if(inv.roomCode && inv.game === "Quanto Vale?"){
   var nick = S.qvMyName || FILOS_NAME || "Anonimo";
   S.qvMyName = nick;
   fbJoinRoom(inv.roomCode, function(ok, err){
    if(!ok){ alert(T("ui_stanza_non_trovata_o_scaduta")); S.screen="home"; render(); return; }
    try{ fbSet(fbRef(fbDB,'rooms/'+inv.roomCode+'/qv_players/'+nick), {joined:Date.now()}); }catch(e){}
    S.qvMode = 'distanza';
    S.screen = 'qv_setup';
    render();
   });
   return;
  }

  // Caso normale: vai alla lista giochi della categoria
  var catId = inv.cat || null;
  if(catId && typeof GAMES !== "undefined" && GAMES[catId] && GAMES[catId].length > 0){
   S.cat = catId;
   S.game = null;
   S.screen = "games";
  } else {
   S.screen = "home"; S.cat = null; S.game = null;
  }
  render();
 };

// Manda un invito a tutti gli altri dispositivi
function sendChallenge(gameName, catId){
 if(!fbDB || !fbSet || !fbRef) return;
 var inv = {
  from: FILOS_NAME || "Anonimo",
  game: gameName,
  cat: catId || null,
  pubCode: FILOS_PUB_CODE || null,
  ts: Date.now()
 };
 var key = "inv_" + Date.now();
 try{
  fbSet(fbRef(fbDB,"filos_invites/"+key), inv);
  // Auto-rimuovi dopo 30 sec
  setTimeout(function(){
   try{fbRemove(fbRef(fbDB,"filos_invites/"+key));}catch(e){}
  },30000);
 }catch(e){console.warn("Invito non inviato:",e);}
}

// Manda un invito QV con stanza già creata (codice incluso nell'invite)
function sendQvChallenge(onRoomReady){
 if(!fbDB || !fbSet || !fbRef) return;
 var nick = S.qvMyName || FILOS_NAME || "Anonimo";
 S.qvMyName = nick;
 fbCreateRoom(function(code, err){
  if(err || !code){ console.warn("Errore creazione stanza QV:", err); return; }
  // Registra host
  try{ fbSet(fbRef(fbDB,'rooms/'+code+'/qv_players/'+nick), {joined:Date.now(), isHost:true}); }catch(e){}
  // Manda invite con roomCode
  var inv = {
   from: nick,
   game: "Quanto Vale?",
   cat: "quantovale",
   roomCode: code,
   pubCode: FILOS_PUB_CODE || null,
   ts: Date.now()
  };
  var key = "inv_" + Date.now();
  try{
   fbSet(fbRef(fbDB,"filos_invites/"+key), inv);
   setTimeout(function(){ try{fbRemove(fbRef(fbDB,"filos_invites/"+key));}catch(e){} }, 30000);
  }catch(e){ console.warn("Invito QV non inviato:", e); }
  if(typeof onRoomReady === "function") onRoomReady(code);
 });
}

// ── Allineamento giochi EN/ES ↔ IT ─────────────────────────
// Le liste tradotte hanno ordine e numero di giochi diversi dall'italiano.
// Ogni gioco tradotto viene collegato al suo originale italiano (_it) e ne
// eredita i flag che attivano il gioco interattivo, oltre a hidden/min/max.
try{if(typeof applyAdulti==="function")applyAdulti();}catch(e){}
(function alignGames(){
 var MAP={
  en:{amici:{"THE TRAITOR":"IL TRADITORE","YES, NO, NOT":"SÌ, NO, NON","WHO AM I?":"CHI SONO IO?","COUNT TO 21":"CONTARE FINO A 21","SYNC":"SINCRONIA","SHE'S A 10 BUT...":"E UN 10 MA...","POINT THE FINGER":"PUNTA IL DITO","FIND THE LIE":"TROVA LA BUGIA","THE WHISPER":"IL SUSSURRO"},
      azione:{"FREEZE!":"FREEZE!","COUNT TO 21":"CONTARE FINO A 21","HUMAN KNOT":"IL NODO UMANO","THE VOICE ACTOR":"IL DOPPIATORE","DOMINO EFFECT":"EFFETTO DOMINO"},
      adulti:{"WHO'S MORE LIKELY?":"CHI È PIÙ PROBABILE?","THE WHISPER":"IL SUSSURRO","THE TRIAL":"IL PROCESSO","SPICY SCALE":"SCALA PICCANTE","EMBARRASSOMETER":"IMBARAZZOMETRO","FIRSTS AND LASTS":"PRIMI E ULTIMI"}},
  es:{amici:{"EL TRAIDOR":"IL TRADITORE","SÍ, NO, TAMPOCO":"SÌ, NO, NON","¿QUIÉN SOY?":"CHI SONO IO?","CONTAR HASTA 21":"CONTARE FINO A 21","SINCRONÍA":"SINCRONIA","ES UN 10 PERO...":"E UN 10 MA...","SEÑALA CON EL DEDO":"PUNTA IL DITO","ENCUENTRA LA MENTIRA":"TROVA LA BUGIA","OPINIONES POLÉMICAS":"HOT TAKES","EL SUSURRO":"IL SUSSURRO","COARTADA":"ALIBI"},
      azione:{"¡FREEZE!":"FREEZE!","CONTAR HASTA 21":"CONTARE FINO A 21","EL NUDO HUMANO":"IL NODO UMANO","EL DOBLADOR":"IL DOPPIATORE","TOCA EL AZUL":"TOUCH BLUE","EFECTO DOMINÓ":"EFFETTO DOMINO"},
      adulti:{"¿QUIÉN ES MÁS PROBABLE?":"CHI È PIÙ PROBABILE?","EL SUSURRO":"IL SUSSURRO","VERDAD O BEBER":"TRUTH OR DRINK","EL JUICIO":"IL PROCESSO","CONFESIONES ANÓNIMAS":"CONFESSIONI ANONIME","ESCALA PICANTE":"SCALA PICCANTE","OPINIONES POLÉMICAS":"HOT TAKES","EMBARAZÓMETRO":"IMBARAZZOMETRO","PRIMEROS Y ÚLTIMOS":"PRIMI E ULTIMI"}}
 };
 var SKIP={hot:1,isnew:1};
 function flags(g){var f=[];for(var k in g){if(g[k]===true&&!SKIP[k])f.push(k);}return f.sort().join("+");}
 function aligned(it,loc){
  if(it.length!==loc.length)return false;
  for(var i=0;i<it.length;i++){var a=flags(it[i]),b=flags(loc[i]);if(b&&a!==b)return false;}
  return true;
 }
 [["en",typeof GAMES_EN!=="undefined"?GAMES_EN:null],["es",typeof GAMES_ES!=="undefined"?GAMES_ES:null]].forEach(function(pair){
  var lang=pair[0],T2=pair[1];if(!T2)return;
  for(var cat in T2){
   var it=GAMES[cat]||[],loc=T2[cat]||[],isAl=aligned(it,loc),map=(MAP[lang]&&MAP[lang][cat])||{};
   for(var i=0;i<it.length;i++)it[i]._it=it[i].name;
   for(var j=0;j<loc.length;j++){
    var g=loc[j],src=null;
    if(map[g.name])src=it.filter(function(x){return x.name===map[g.name];})[0];
    if(!src&&isAl)src=it[j];
    if(!src){var f=flags(g);if(f){var c=it.filter(function(x){return flags(x)===f;});if(c.length===1)src=c[0];}}
    if(!src)src=it.filter(function(x){return x.name===g.name;})[0];
    if(!src)continue;
    g._it=src.name;
    for(var k in src){
     if(k in g)continue;
     if((src[k]===true&&!SKIP[k])||k==="min"||k==="max")g[k]=src[k];
    }
   }
  }
 });
 for(var c in GAMES){(GAMES[c]||[]).forEach(function(x){if(!x._it)x._it=x.name;});}
})();
